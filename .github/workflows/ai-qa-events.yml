# Event-driven AI QA caller workflow (Layer 1 PR review / Layer 4 ai-fix / Layer 5 ai-prototype).
#
# Initial rollout note:
#   Automatic PR triggers (`opened, synchronize, reopened`) are disabled until `ANTHROPIC_API_KEY`
#   and `OPENAI_API_KEY` repository secrets are configured. Once both secrets are set, change
#   `pull_request.types` below to `[opened, synchronize, reopened, labeled]` to enable automatic
#   Layer 1 PR review on every non-draft pull request.
#
# Security: uses `pull_request` only (never the privileged target-branch PR trigger) with same-repo
# fork guards and OWNER/MEMBER/COLLABORATOR checks on issue-triggered jobs.

name: AI QA (events)

on:
  pull_request:
    types: [labeled]
    # After setting ANTHROPIC_API_KEY and OPENAI_API_KEY secrets, switch to:
    # types: [opened, synchronize, reopened, labeled]
  issues:
    types: [labeled]

permissions: {}

jobs:
  pr-review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'deep-audit')
    concurrency:
      group: ai-qa-pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    uses: n3dypop/repo-autopilot/.github/workflows/layer1-pr-review.yml@4c7508da70bff52d43ad771c21b6e279c3f85982 # v0.1.3
    with:
      repo_tier: 'A'
      runtime: 'node'
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COST_WEBHOOK_URL: ${{ secrets.COST_WEBHOOK_URL }}
      COST_WEBHOOK_TOKEN: ${{ secrets.COST_WEBHOOK_TOKEN }}

  label-fix:
    if: >-
      github.event.label.name == 'ai-fix' &&
      (github.event_name == 'issues' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issues' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    concurrency:
      group: ai-qa-label-fix-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: n3dypop/repo-autopilot/.github/workflows/layer4-label-fix.yml@4c7508da70bff52d43ad771c21b6e279c3f85982 # v0.1.3
    with:
      repo_tier: 'A'
      runtime: 'node'
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COST_WEBHOOK_URL: ${{ secrets.COST_WEBHOOK_URL }}
      COST_WEBHOOK_TOKEN: ${{ secrets.COST_WEBHOOK_TOKEN }}

  product-prototype:
    if: >-
      github.event.label.name == 'ai-prototype' &&
      (github.event_name == 'issues' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issues' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    concurrency:
      group: ai-qa-product-prototype-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: n3dypop/repo-autopilot/.github/workflows/layer5-prototype.yml@4c7508da70bff52d43ad771c21b6e279c3f85982 # v0.1.3
    with:
      repo_tier: 'A'
      runtime: 'node'
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COST_WEBHOOK_URL: ${{ secrets.COST_WEBHOOK_URL }}
      COST_WEBHOOK_TOKEN: ${{ secrets.COST_WEBHOOK_TOKEN }}
