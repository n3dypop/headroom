# Scheduled & manual AI QA caller workflow (Layer 2 nightly tests / Layer 3 audit / Layer 5 product evolution).
#
# Initial rollout note:
#   Cron schedules are commented out until `ANTHROPIC_API_KEY` and `OPENAI_API_KEY` secrets are set
#   and verified with a manual `workflow_dispatch` run. Uncomment `schedule:` below when ready:
#     '0 18 * * 1,3,5'  3x/week (Mon/Wed/Fri) -> Layer 2 nightly tests (Tier A)
#     '0 20 1 * *'      monthly (1st)         -> Layer 5 UX friction audit
#     '0 21 1 * *'      monthly (1st)         -> Layer 5 PM ideation (`gpt-6.2-astra` `xhigh`)

name: AI QA (schedules)

on:
  # Uncomment after configuring ANTHROPIC_API_KEY and OPENAI_API_KEY repository secrets:
  # schedule:
  #   - cron: '0 18 * * 1,3,5'
  #   - cron: '0 20 1 * *'
  #   - cron: '0 21 1 * *'
  workflow_dispatch:
    inputs:
      layer:
        description: 'Layer to run'
        required: true
        type: choice
        options:
          - nightly-tests
          - weekly-audit
          - ux-friction
          - pm-ideation
      max_targets:
        description: 'Max targets for nightly-tests'
        required: false
        type: number
        default: 2
      focus:
        description: 'Optional focus theme for Layer 5 ux-friction / pm-ideation'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  nightly-tests:
    if: >-
      github.event.schedule == '0 18 * * 1,3,5' ||
      (github.event_name == 'workflow_dispatch' && inputs.layer == 'nightly-tests')
    concurrency:
      group: ai-qa-nightly-tests
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    uses: n3dypop/repo-autopilot/.github/workflows/layer2-nightly-tests.yml@7a49c17f16561abcc8c661648c41adabd2039331 # v0.1.4
    with:
      repo_tier: 'A'
      runtime: 'node'
      max_targets: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('{0}', inputs.max_targets) != '' && format('{0}', inputs.max_targets) || '2') }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COST_WEBHOOK_URL: ${{ secrets.COST_WEBHOOK_URL }}
      COST_WEBHOOK_TOKEN: ${{ secrets.COST_WEBHOOK_TOKEN }}

  weekly-audit:
    if: >-
      github.event.schedule == '0 19 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.layer == 'weekly-audit')
    concurrency:
      group: ai-qa-weekly-audit
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: n3dypop/repo-autopilot/.github/workflows/layer3-weekly-audit.yml@7a49c17f16561abcc8c661648c41adabd2039331 # v0.1.4
    with:
      repo_tier: 'A'
      runtime: 'node'
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COST_WEBHOOK_URL: ${{ secrets.COST_WEBHOOK_URL }}
      COST_WEBHOOK_TOKEN: ${{ secrets.COST_WEBHOOK_TOKEN }}

  ux-friction:
    if: >-
      github.event.schedule == '0 20 1 * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.layer == 'ux-friction')
    concurrency:
      group: ai-qa-ux-friction
      cancel-in-progress: false
    permissions:
      contents: read
      discussions: write
      issues: read
      pull-requests: read
    uses: n3dypop/repo-autopilot/.github/workflows/layer5-product-evolve.yml@7a49c17f16561abcc8c661648c41adabd2039331 # v0.1.4
    with:
      repo_tier: 'A'
      runtime: 'node'
      mode: 'ux-friction'
      focus: ${{ inputs.focus || '' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COST_WEBHOOK_URL: ${{ secrets.COST_WEBHOOK_URL }}
      COST_WEBHOOK_TOKEN: ${{ secrets.COST_WEBHOOK_TOKEN }}

  pm-ideation:
    if: >-
      github.event.schedule == '0 21 1 * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.layer == 'pm-ideation')
    concurrency:
      group: ai-qa-pm-ideation
      cancel-in-progress: false
    permissions:
      contents: read
      discussions: write
      issues: read
      pull-requests: read
    uses: n3dypop/repo-autopilot/.github/workflows/layer5-product-evolve.yml@7a49c17f16561abcc8c661648c41adabd2039331 # v0.1.4
    with:
      repo_tier: 'A'
      runtime: 'node'
      mode: 'pm-ideation'
      focus: ${{ inputs.focus || '' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COST_WEBHOOK_URL: ${{ secrets.COST_WEBHOOK_URL }}
      COST_WEBHOOK_TOKEN: ${{ secrets.COST_WEBHOOK_TOKEN }}
